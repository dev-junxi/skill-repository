spring:
  application:
    name: __ARTIFACT_PREFIX__-server
  # ADR-0004：虚拟线程。注意 JDK 21 下 synchronized 块内阻塞会 pin 住载体线程
  # （HikariCP / MyBatis 内部都有），连接池仍是并发上限，别以为开了就无限并发
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: 8080
  # 多实例滚动发布必需：否则停机实例上正在处理的请求（尤其 SSE 长连接）会被砍断
  shutdown: graceful

spring.datasource.hikari:
  # 多实例下总连接数 = 实例数 × 这个值，配置时按 MySQL max_connections 倒推（ADR-0011）
  maximum-pool-size: 10
  minimum-idle: 2
  connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    enable:
      # 连接池排队时间必须可见——语句执行快不代表接口快
      hikaricp: true
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

__ARTIFACT_PREFIX__:
  web:
    enabled: true
    log:
      max-body-length: 4096
      # 响应体全是用户自然语言的端点，在这里登记前缀
      redact-paths: []
    doc:
      enabled: true
      title: __CLASS_PREFIX__ API
      version: v1
  auth:
    enabled: true
    access-token-ttl: 2h
    refresh-token-ttl: 90d

sa-token:
  token-name: Authorization
  is-read-cookie: false
  is-print: false
  # Stateless 模式下这就是签名密钥，必须走环境变量，绝不提交进 yml
  jwt-secret-key: ${__ENV_PREFIX___JWT_SECRET:dev-only-secret-do-not-use-in-production}

logging:
  level:
    root: info
    __BASE_PACKAGE__: info
